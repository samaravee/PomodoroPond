<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koi Pond Pomodoro Timer</title>
  <meta name="description" content="A calming koi pond Pomodoro timer.">
  <style>
:root {
  box-sizing: border-box;
  --bg: #121214;
  --surface: #1d1d20;
  --text: #f1f1ee;
  --muted: #a2a29d;
  --line: #333336;
  --accent: #8fb4f5;
  --accent-text: #0e1a33;
  /* Change this to match your artboard shape (width / height) */
  --riv-ratio: 2000 / 1400;
}

*, *::before, *::after { box-sizing: inherit; }

html { scroll-padding-top: 80px; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.6;
}

a { color: inherit; }
a:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}

/* ---------- Navbar ---------- */
.site-header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  padding: 18px clamp(16px, 5vw, 56px);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-weight: 600;
  text-decoration: none;
  justify-self: start;
}
.nav-links {
  display: flex;
  gap: 24px;
  justify-content: center;
}
.nav-links a {
  text-decoration: none;
  color: var(--muted);
  font-size: 0.95rem;
}
.nav-links a:hover { color: var(--text); }
.nav-links a[aria-current="page"] { color: var(--accent); }

.btn {
  justify-self: end;
  display: inline-block;
  background: var(--accent);
  color: var(--accent-text);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.85rem;
  padding: 8px 16px;
  border-radius: 999px;
}
.btn:hover { filter: brightness(1.08); }

/* ---------- Main ---------- */
main {
  flex: 1;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 48px clamp(16px, 5vw, 56px) 64px;
}

/* ---------- Rive frame ---------- */
.rive-frame {
  position: relative;
  width: 100%;
  aspect-ratio: var(--riv-ratio);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
}
.rive-frame canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.rive-msg {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  color: var(--muted);
  pointer-events: none;
}
[hidden] { display: none !important; }

/* ---------- Pop-out (picture-in-picture) ---------- */
.pond-tools { display: flex; justify-content: flex-end; margin: 0 0 12px; }
.tool-btn {
  font: inherit;
  font-size: 0.85rem;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
}
.tool-btn:hover { border-color: var(--accent); color: var(--accent); }
.rive-slot { position: relative; width: 100%; }
.pip-ph {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  height: 100%;
  min-height: 200px;
  border: 1px dashed var(--line);
  border-radius: 16px;
  color: var(--muted);
  text-align: center;
  padding: 24px;
}
.rive-frame.in-pip {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 0;
}

/* ---------- About ---------- */
.about h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; margin: 0 0 16px; }
.about p { max-width: 62ch; color: var(--muted); font-size: 1.05rem; }
.socials { display: flex; gap: 16px; margin-top: 28px; }
.socials a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  text-decoration: none;
  color: var(--text);
  font-size: 0.95rem;
}
.socials a:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- Footer ---------- */
.site-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 20px clamp(16px, 5vw, 56px);
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.85rem;
}
.footer-icons { display: flex; gap: 16px; }
.footer-icons a { display: inline-flex; color: var(--muted); }
.footer-icons a:hover { color: var(--text); }
.footer-icons svg { width: 18px; height: 18px; }

/* ---------- Mobile ---------- */
@media (max-width: 720px) {
  .site-header {
    grid-template-columns: 1fr auto;
    grid-template-areas: "brand btn" "links links";
  }
  .brand { grid-area: brand; }
  .btn { grid-area: btn; }
  .nav-links { grid-area: links; justify-content: flex-start; }
  main { padding-top: 28px; }
}

  </style>
</head>
<body data-page="home">

  <header class="site-header">
    <a class="brand" href="index.html">Koi Pond Pomodoro Timer</a>
    <nav class="nav-links" aria-label="Main">
      <a href="index.html" data-nav="home">Home</a>
      <a href="play.html" data-nav="play">Play</a>
      <a href="about.html" data-nav="about">About</a>
    </nav>
    <a class="btn" href="#" target="_blank" rel="noopener">Join Our Discord!</a>
  </header>

  <main>
    <div class="pond-tools">
      <button type="button" class="tool-btn" id="pip-btn" hidden>Pop out timer</button>
    </div>
    <div class="rive-slot" id="rive-slot">
      <div class="rive-frame">
        <canvas id="rive-canvas" aria-label="Koi pond Pomodoro timer animation"></canvas>
        <div class="rive-msg" id="rive-msg">Loading animation…</div>
      </div>
      <div class="pip-ph" id="pip-ph" hidden>The timer is playing in the pop-out window.</div>
    </div>
  </main>

  <footer class="site-footer">
    <span>&copy; <span id="year">2026</span> Samara Tekieli. All rights reserved.</span>
    <div class="footer-icons">
      <a href="#" aria-label="Instagram" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" aria-label="LinkedIn" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 11v6M8 7.5v.01M12 17v-6M12 13.5c0-1.5 1-2.5 2.5-2.5S17 12 17 13.5V17"/></svg>
      </a>
      <a href="#" aria-label="Portfolio" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
      </a>
    </div>
  </footer>

  <script>
  /* Keep-alive frame loop. Browsers stop requestAnimationFrame in background tabs, which
     would freeze the pond and its timer. While the tab is hidden this keeps the animation
     ticking from a background worker instead (a few times a second, on a tiny canvas). */
  (function () {
    var nativeRAF = window.requestAnimationFrame.bind(window);
    var nativeCAF = window.cancelAnimationFrame.bind(window);
    var pending = {};
    var nextId = 1;
    var worker = null, fallbackTimer = null;
    window.__nativeRAF = nativeRAF;

    function run(id, t) {
      var rec = pending[id];
      if (!rec) return;
      delete pending[id];
      nativeCAF(rec.raf);
      rec.cb(t);
    }
    window.requestAnimationFrame = function (cb) {
      var id = nextId++;
      var rec = { cb: cb, raf: 0 };
      pending[id] = rec;
      rec.raf = nativeRAF(function (t) { run(id, t); });
      return id;
    };
    window.cancelAnimationFrame = function (id) {
      var rec = pending[id];
      if (!rec) return;
      nativeCAF(rec.raf);
      delete pending[id];
    };

    function tick() {
      var t = performance.now();
      Object.keys(pending).forEach(function (k) { run(+k, t); });
    }
    function startTicker() {
      if (worker || fallbackTimer) return;
      try {
        var url = URL.createObjectURL(new Blob(["setInterval(function(){postMessage(1)},200)"], { type: "text/javascript" }));
        worker = new Worker(url);
        worker.onmessage = tick;
      } catch (e) {
        fallbackTimer = setInterval(tick, 250);
      }
    }
    function stopTicker() {
      if (worker) { worker.terminate(); worker = null; }
      if (fallbackTimer) { clearInterval(fallbackTimer); fallbackTimer = null; }
    }
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) startTicker(); else stopTicker();
    });
    if (document.hidden) startTicker();
  })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2@2.49.4/rive.js"></script>
  <script>
  /* SETTINGS: edit these for your Rive file */
  var RIVE_CONFIG = {
    home: {
      src: "home.riv",           // your Rive file name (same folder as this page)
      // Everything below is optional. Leave as-is and it works it out itself.
      stateMachine: "State Machine 1",    // named directly so the file loads once (needed for GPU Canvas)
      ratio: "2000 / 1400", // your artboard size (width / height)
      artboard: "",        // default artboard if empty
      fit: "Contain"       // "Contain", "Layout", "Cover", "Fill", "FitWidth", "FitHeight"
    }
  };

  (function () {
    var page = document.body.getAttribute("data-page");

    // Highlight the current page in the navbar
    document.querySelectorAll(".nav-links a").forEach(function (a) {
      if (a.getAttribute("data-nav") === page) a.setAttribute("aria-current", "page");
    });

    // Footer year
    var y = document.getElementById("year");
    if (y) y.textContent = new Date().getFullYear();

    // Rive (only on pages that have a canvas)
    var canvas = document.getElementById("rive-canvas");
    var msg = document.getElementById("rive-msg");
    var cfg = RIVE_CONFIG[page];
    if (!canvas || !cfg) return;
    var frame = canvas.parentElement;
    var r = null;

    function showMsg(text) {
      if (msg) { msg.hidden = false; msg.textContent = text; }
    }

    if (typeof rive === "undefined") {
      showMsg("The Rive runtime didn't load. Check your internet connection.");
      return;
    }

    var fit = rive.Fit[cfg.fit] !== undefined ? rive.Fit[cfg.fit] : rive.Fit.Contain;

    function start(stateMachine) {
      var options = {
        src: cfg.src,
        canvas: canvas,
        autoplay: true,
        autoBind: true,
        enableGPUCanvas: true,   // needed for shaders (webgl2 2.42.0+)
        layout: new rive.Layout({ fit: fit, alignment: rive.Alignment.Center }),
        onLoad: function () {
          // No state machine named? Find the file's first one and restart with it.
          if (!stateMachine) {
            var names = r.stateMachineNames || [];
            if (names.length) {
              r.cleanup();
              r = null;
              start(names[0]);
              return;
            }
          }
          // Match the frame shape to the artboard unless a ratio was set
          if (cfg.ratio) {
            frame.style.aspectRatio = cfg.ratio;
          } else {
            try {
              var b = r.bounds;
              if (b && b.maxX > b.minX && b.maxY > b.minY) {
                frame.style.aspectRatio = (b.maxX - b.minX) + " / " + (b.maxY - b.minY);
              }
            } catch (e) {}
          }
          loaded = true;
          warmUntil = performance.now() + 2500;
          applySize();
          if (msg) msg.hidden = true;
        },
        onLoadError: function (err) {
          console.error("Rive load error for " + cfg.src, err);
          if (location.protocol === "file:") {
            showMsg("This page was opened straight from your computer, which blocks loading " + cfg.src + ". Publish the folder (Netlify Drop) or run a local server.");
            return;
          }
          fetch(cfg.src).then(function (res) {
            if (!res.ok) {
              showMsg("Can't find " + cfg.src + " (error " + res.status + "). It must sit in the same folder as this page.");
            } else {
              showMsg("Found " + cfg.src + ", but the Rive runtime couldn't read it. Open the browser console (F12) for details.");
            }
          }).catch(function () {
            showMsg("Couldn't download " + cfg.src + ". Check your connection and that the file is in the same folder.");
          });
        }
      };
      if (stateMachine) options.stateMachines = stateMachine;
      if (cfg.artboard) options.artboard = cfg.artboard;
      r = new rive.Rive(options);
    }


    // ---------------------------------------------------------------
    // Performance: render scale (how many pixels the water is drawn at)
    // ---------------------------------------------------------------
    var scale = window.devicePixelRatio || 1;   // full native sharpness, same as plain Rive
    var loaded = false, warmUntil = 0;
    var pipWin = null;

    function currentScale() {
      // In a hidden tab (no pop-out) draw on a tiny surface: the timer still ticks, almost no GPU use
      return (document.hidden && !pipWin) ? 0.03 : scale;
    }
    function applySize() {
      if (!r) return;
      try { r.resizeDrawingSurfaceToCanvas(currentScale()); } catch (e) {}
    }
    document.addEventListener("visibilitychange", function () {
      applySize();
      warmUntil = performance.now() + 1500;
    });


    // ---------------------------------------------------------------
    // Pop-out window (Document Picture-in-Picture: Chrome, Edge, newer Firefox)
    // ---------------------------------------------------------------
    var pipBtn = document.getElementById("pip-btn");
    var slot = document.getElementById("rive-slot");
    var ph = document.getElementById("pip-ph");
    var savedAR = "";

    function restoreFromPip() {
      if (!pipWin) return;
      pipWin = null;
      frame.classList.remove("in-pip");
      frame.style.aspectRatio = savedAR;
      slot.insertBefore(frame, slot.firstChild);
      slot.style.height = "";
      ph.hidden = true;
      pipBtn.textContent = "Pop out timer";
      applySize();
      setTimeout(applySize, 80);
    }
    function openPip() {
      var rect = frame.getBoundingClientRect();
      var w = 520;
      var h = Math.max(220, Math.round(w * rect.height / rect.width));
      window.documentPictureInPicture.requestWindow({ width: w, height: h }).then(function (win) {
        pipWin = win;
        win.document.title = "Koi Pond Timer";
        document.querySelectorAll("style").forEach(function (s) {
          win.document.head.appendChild(s.cloneNode(true));
        });
        slot.style.height = rect.height + "px";
        savedAR = frame.style.aspectRatio;
        frame.style.aspectRatio = "auto";
        frame.classList.add("in-pip");
        win.document.body.appendChild(frame);
        ph.hidden = false;
        pipBtn.textContent = "Bring it back";
        win.addEventListener("resize", applySize);
        win.addEventListener("pagehide", restoreFromPip);
        applySize();
        setTimeout(applySize, 80);
      }).catch(function (e) {
        console.error("Pop-out failed", e);
      });
    }
    if (pipBtn && "documentPictureInPicture" in window) {
      pipBtn.hidden = false;
      pipBtn.addEventListener("click", function () {
        if (pipWin) pipWin.close(); else openPip();
      });
    }

    start(cfg.stateMachine);

    // Keep the animation sharp when the container resizes
    if (window.ResizeObserver) {
      new ResizeObserver(applySize).observe(frame);
    } else {
      window.addEventListener("resize", applySize);
    }
  })();
  
</script>
</body>
